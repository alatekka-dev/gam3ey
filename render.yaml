# Free hosting on Render (https://render.com): New + > Blueprint > select this repository.
# The free plan sleeps after inactivity and its disk is temporary, so the
# embedded database is re-created with demo data on each start. That is
# intended: this deployment is a demo, not a production system.
services:
  - type: web
    name: gam3ey-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: JWT_SECRET
        generateValue: true
